name: collect

# Ingest recent closed candles into Neon every 15 minutes.
# GitHub Actions cron is UTC and best-effort — it delays/drops runs at congested times
# (top of hour, quarter-hours), so we schedule on odd minutes to run more reliably.
# Scheduled workflows run only on the default branch.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest candles
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          KATANA_API_BASE: ${{ vars.KATANA_API_BASE }}
        run: python -m src.collect
