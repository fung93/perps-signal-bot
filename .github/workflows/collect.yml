name: collect

# Ingest closed candles into Neon. An external cron (cron-job.org) hits this workflow's
# dispatch API hourly when healthy — but it can die silently (it did), so this hourly schedule
# is a REAL fallback, not a token one. GitHub's own scheduler is best-effort and drops runs,
# which is why the external cron is still preferred. Schedules run only on `main`.
#
# NOTE ON FREQUENCY: hourly is deliberate and must not be increased. Signals are 1h-timeframe,
# and Neon free tier bills *awake* time — it auto-suspends after ~5 min idle. Triggering more
# often than every 5 minutes keeps the database awake 24/7 and burns the entire monthly
# compute-hour allowance in days (this happened on 2026-08-20).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  actions: read      # the alert step reads recent run conclusions

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest candles
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          KATANA_API_BASE: ${{ vars.KATANA_API_BASE }}
        # One retry after a pause: a transient blip (API rate limit, Neon cold-start spike)
        # shouldn't skip an hour of data or cry wolf. Only a persistent failure alerts.
        run: |
          python -m src.collect || {
            echo "attempt 1 failed; retrying in 60s"
            sleep 60
            python -m src.collect
          }

      # Blackouts must be loud, but only ONCE. During a multi-day outage every run fails;
      # alerting each time sent hundreds of identical messages (2026-08-20). So alert only on
      # the transition into failure: if the previous completed run already failed, stay quiet.
      # This step needs no database, so it still works mid-outage.
      - name: Alert on failure
        if: failure() && !cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/collect.yml/runs?status=completed&per_page=1" \
            | jq -r '.workflow_runs[0].conclusion // "unknown"')
          echo "previous completed run: ${prev}"
          if [ "${prev}" = "failure" ]; then
            echo "outage already reported — staying quiet"
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Perps bot: collect is FAILING as of $(date -u '+%Y-%m-%d %H:%M') UTC. You'll get no repeat alerts until it recovers. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
