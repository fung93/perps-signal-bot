name: collect

# Ingest closed candles into Neon. An external cron (cron-job.org) hits this workflow's
# dispatch API hourly when healthy — but it can die silently (it did), so this hourly schedule
# is a REAL fallback, not a token one. GitHub's own scheduler is best-effort and drops runs,
# which is why the external cron is still preferred. Schedules run only on `main`.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest candles
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          KATANA_API_BASE: ${{ vars.KATANA_API_BASE }}
        run: python -m src.collect

      # Blackouts must be loud: if the run fails (e.g. DB quota exhausted), say so on
      # Telegram directly — this step needs no database, so it works mid-outage.
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Perps bot: collect run FAILED at $(date -u '+%Y-%m-%d %H:%M') UTC. Check GitHub Actions / Neon quota." \
            > /dev/null
