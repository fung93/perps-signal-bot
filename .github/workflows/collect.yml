name: collect

# Ingest closed candles into Neon. Signals live on the 1h timeframe, so an hourly run is the
# right cadence. The RELIABLE trigger is an external cron (cron-job.org) calling this
# workflow's dispatch API every hour — GitHub's own scheduler is best-effort and drops runs.
# The hourly schedule below is a standalone fallback; once the external cron is confirmed,
# remove it to avoid double-spending free Actions minutes. Schedules run only on `main`.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest candles
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          KATANA_API_BASE: ${{ vars.KATANA_API_BASE }}
        run: python -m src.collect
