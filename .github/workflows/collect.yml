name: collect

# Ingest closed candles into Neon. The RELIABLE trigger is an external cron (cron-job.org)
# calling this workflow's dispatch API hourly (confirmed firing on time). The schedule below
# is now just a sparse safety net (every 6h) in case that external cron ever fails — GitHub's
# own scheduler is best-effort, so it's a backup, not the primary. Schedules run only on `main`.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest candles
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          MAX_SIGNALS_PER_DAY: ${{ vars.MAX_SIGNALS_PER_DAY }}
          KATANA_API_BASE: ${{ vars.KATANA_API_BASE }}
        run: python -m src.collect
