name: reconcile

# Grade open signals once daily, just after the active day closes (14:30 UTC = 22:30 MYT).
# Grading is retrospective bookkeeping, so hourly gained nothing and doubled Neon wake-ups.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Grade signals
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python -m src.feedback.grade
